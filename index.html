<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1b1430" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Clara</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root {
    --bg: #1b1430;
    --bg2: #271c45;
    --card: #342656;
    --ink: #fff8ef;
    --muted: #d9cce8;
    --coral: #ff7a59;
    --sun: #ffc857;
    --mint: #3ddc97;
    --sky: #7cc4ff;
    --pink: #ff8ad4;
    --accent: #ff8ad4;
    --line: rgba(255,255,255,.12);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    background:
      radial-gradient(900px 500px at 80% -10%, #5a3d8a 0%, transparent 55%),
      radial-gradient(700px 400px at -10% 110%, var(--accent) 0%, transparent 40%),
      var(--bg);
    color: var(--ink);
    min-height: 100%;
  }
  button, input, select, textarea, .tap { font-family: inherit; }
  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100dvh;
    padding: calc(14px + env(safe-area-inset-top)) 16px calc(22px + env(safe-area-inset-bottom));
  }
  header.top {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-bottom: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .moon {
    width: 46px; height: 46px; border-radius: 16px;
    background: linear-gradient(145deg, #ffe29a, var(--accent));
    display: grid; place-items: center; font-size: 26px;
    box-shadow: 0 8px 20px rgba(0,0,0,.25);
  }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.3px; }
  h2 { margin: 6px 0 12px; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .stars {
    background: rgba(255,255,255,.08); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 12px; font-weight: 700;
  }
  .side { display: flex; align-items: center; gap: 8px; }
  .mute { border: 0; background: rgba(255,255,255,.1); color: white; border-radius: 999px; width: 38px; height: 38px; font-size: 18px; cursor: pointer; }
  .streak { margin: 0 0 12px; color: var(--sun); font-weight: 700; font-size: 14px; }
  .bubble {
    background: #fff8ef; color: #24183a; border-radius: 20px 20px 20px 6px;
    padding: 12px 14px; font-size: 17px; line-height: 1.35; margin-bottom: 12px; font-weight: 700;
    box-shadow: 0 8px 20px rgba(0,0,0,.18);
  }
  .choice:disabled { opacity: .55; cursor: default; }
  .grid { display: grid; gap: 12px; }
  .world {
    border: 0; text-align: left; color: inherit; cursor: pointer;
    border-radius: 22px; padding: 14px; display: grid; grid-template-columns: 56px 1fr auto;
    gap: 12px; align-items: center; background: var(--card);
    box-shadow: 0 10px 24px rgba(0,0,0,.18);
  }
  .world:active { transform: scale(.98); }
  .ico {
    width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center;
    font-size: 30px;
  }
  .w-math { background: #3a2a78; }
  .w-time { background: #2c3f72; }
  .w-en { background: #2d4a45; }
  .w-soc { background: #5a3058; }
  .w-nov { background: #6b3a2a; }
  .w-chat { background: #2a5a6b; }
  .w-alb { background: #5a5a2a; }
  .world b { display: block; font-size: 18px; }
  .world span { color: var(--muted); font-size: 13px; }
  .lvl { font-size: 12px; color: var(--sun); font-weight: 700; }
  .go { font-size: 22px; opacity: .7; }
  .panel {
    background: rgba(255,255,255,.06); border: 1px solid var(--line);
    border-radius: 18px; padding: 14px; margin: 0 0 12px; color: var(--muted); font-size: 14px; line-height: 1.45;
  }
  .panel b.t { color: var(--ink); font-size: 16px; display: block; margin-bottom: 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .chip {
    border: 0; border-radius: 999px; padding: 10px 14px; background: rgba(255,255,255,.1);
    color: var(--ink); cursor: pointer; font-size: 15px;
  }
  .chip.on { background: var(--accent); color: #24183a; font-weight: 700; }
  .chip.done { opacity: .6; }
  .bigbtn {
    width: 100%; border: 0; border-radius: 18px; padding: 14px; font-size: 17px; font-weight: 800;
    background: rgba(255,255,255,.1); color: var(--ink); cursor: pointer; margin-bottom: 12px; text-align: left;
  }
  .bigbtn.hl { background: var(--accent); color: #24183a; }
  .playhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
  .back, .speak {
    border: 0; background: rgba(255,255,255,.1); color: white; border-radius: 14px;
    padding: 10px 12px; font-size: 16px; cursor: pointer;
  }
  .q {
    font-size: 28px; line-height: 1.2; font-weight: 800; margin: 8px 0 14px; letter-spacing: -.4px;
  }
  .q.nov { font-size: 21px; line-height: 1.3; font-weight: 700; }
  .hint { color: var(--muted); font-size: 16px; margin-bottom: 12px; min-height: 22px; }
  .hint.pq { color: var(--sun); font-weight: 800; font-size: 19px; }
  .stage {
    min-height: 150px; border-radius: 22px; background: rgba(255,255,255,.05);
    border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
    gap: 18px; padding: 16px; margin-bottom: 14px; flex-wrap: wrap;
  }
  .pile { text-align: center; }
  .objs { font-size: 30px; letter-spacing: 2px; line-height: 1.25; max-width: 220px; }
  .objs.sm { font-size: 22px; }
  .choices { display: grid; gap: 10px; }
  .choices.two { grid-template-columns: 1fr 1fr; }
  .choice {
    border: 2px solid transparent; background: #fff8ef; color: #24183a;
    border-radius: 18px; min-height: 68px; font-size: 22px; font-weight: 800;
    cursor: pointer; padding: 12px;
  }
  .choice.small { font-size: 18px; font-weight: 700; text-align: left; }
  .choice.good { background: #b8f3d6; border-color: #1d9a62; }
  .choice.bad { background: #ffd0c6; border-color: #d4543c; }
  .feedback {
    margin-top: 12px; border-radius: 16px; padding: 12px 14px; font-size: 16px; line-height: 1.35;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.ok { background: rgba(61,220,151,.18); }
  .feedback.no { background: rgba(255,122,89,.18); }
  .next {
    width: 100%; margin-top: 12px; border: 0; border-radius: 16px; padding: 16px;
    font-size: 18px; font-weight: 800; background: var(--accent); color: #24183a; cursor: pointer;
    display: none;
  }
  .next.show { display: block; }
  .dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .dot { width: 10px; height: 10px; border-radius: 99px; background: rgba(255,255,255,.2); }
  .dot.on { background: var(--accent); }
  .reward { text-align: center; padding-top: 22px; }
  .reward .big { font-size: 72px; }
  .reward .fig { font-size: 64px; margin: 10px 0 0; }
  .hidden { display: none !important; }
  .bar { height: 8px; background: rgba(255,255,255,.12); border-radius: 99px; overflow: hidden; margin: 8px 0 14px; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--coral), var(--accent)); }
  .word { font-size: 40px; font-weight: 800; letter-spacing: -.5px; text-align: center; }
  .word.md { font-size: 26px; }
  .en { color: var(--sky); }
  .splash { min-height: 80dvh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 18px; }
  .splash .av { font-size: 96px; animation: pop .6s ease; }
  .splash .msg { font-size: 26px; font-weight: 800; line-height: 1.3; max-width: 340px; }
  @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
  .field { display: block; margin: 0 0 14px; }
  .field span { display: block; color: var(--muted); font-size: 14px; margin-bottom: 6px; }
  .inp {
    width: 100%; border: 2px solid var(--line); background: rgba(255,255,255,.08); color: var(--ink);
    border-radius: 14px; padding: 12px; font-size: 17px;
  }
  select.inp option { color: #24183a; }
  textarea.inp { min-height: 90px; resize: vertical; }
  .cores { display: flex; gap: 12px; flex-wrap: wrap; }
  .cor { width: 54px; height: 54px; border-radius: 99px; border: 4px solid transparent; cursor: pointer; }
  .cor.on { border-color: #fff8ef; }
  .avs { display: flex; gap: 8px; flex-wrap: wrap; }
  .avs button { font-size: 30px; width: 56px; height: 56px; border-radius: 16px; border: 3px solid transparent; background: rgba(255,255,255,.08); cursor: pointer; }
  .avs button.on { border-color: var(--accent); }
  .faces { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 14px; }
  .faces button { flex: 1; font-size: 34px; padding: 10px 0; border-radius: 16px; border: 3px solid transparent; background: rgba(255,255,255,.08); cursor: pointer; }
  .faces button.on { border-color: var(--accent); background: rgba(255,255,255,.18); }
  .album h3 { margin: 16px 0 8px; font-size: 16px; color: var(--sun); }
  .figs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .figc { background: var(--card); border-radius: 14px; padding: 8px 4px; text-align: center; font-size: 11px; color: var(--muted); }
  .figc div { font-size: 34px; }
  .figc.off div { filter: grayscale(1); opacity: .25; }
  .cap { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; }
  .cap.lock { opacity: .55; }
  .chatlog { display: flex; flex-direction: column; gap: 8px; min-height: 45dvh; max-height: 58dvh; overflow-y: auto; padding: 4px 0 10px; }
  .msg { max-width: 85%; padding: 10px 12px; border-radius: 16px; font-size: 16px; line-height: 1.35; white-space: pre-wrap; }
  .msg.lua { background: #fff8ef; color: #24183a; align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.eu { background: var(--accent); color: #24183a; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.wait { opacity: .6; }
  .chatform { display: flex; gap: 8px; }
  .chatform .inp { flex: 1; }
  .chatform button { border: 0; border-radius: 14px; padding: 0 16px; font-weight: 800; background: var(--accent); color: #24183a; font-size: 16px; cursor: pointer; }
  .pais { display: block; text-align: center; margin: 18px auto 0; color: var(--muted); font-size: 13px; text-decoration: none; opacity: .7; }
  .clock { width: 170px; height: 170px; }
</style>
</head>
<body>
<div class="app">
  <section id="abertura" class="hidden">
    <div class="splash">
      <div class="av" id="abAv">🌙</div>
      <div class="msg" id="abMsg"></div>
      <button class="next show" id="abBtn" style="max-width:320px">Vamos! ✨</button>
    </div>
  </section>

  <section id="onboard" class="hidden">
    <div class="playhead">
      <button class="back" id="obBack">‹ Voltar</button>
      <div class="dots" id="obDots"></div>
      <span style="width:60px"></span>
    </div>
    <div id="obBody"></div>
    <button class="next show" id="obNext">Próximo ›</button>
  </section>

  <section id="home" class="hidden">
    <header class="top">
      <div class="brand">
        <div class="moon" id="homeAv">🌙</div>
        <div>
          <h1 id="homeName">Clara</h1>
          <div class="sub" id="homeSub">com a Lua</div>
        </div>
      </div>
      <div class="side">
        <button class="mute" id="muteBtn" aria-label="Som ligado ou desligado">🔊</button>
        <button class="mute" id="cfgBtn" aria-label="Meus gostos">⚙️</button>
        <div class="stars" id="starCount">⭐ 0</div>
      </div>
    </header>
    <div class="bubble" id="bubble"></div>
    <div class="streak hidden" id="streak"></div>
    <button class="bigbtn" id="humorBtn">💬 Como foi o seu dia?</button>
    <div class="panel" id="mdia">
      <b class="t">⭐ Missão do dia</b>
      <div class="row" id="mdiaRow" style="margin-top:0"></div>
    </div>
    <div class="grid" id="worlds"></div>
    <a class="pais" href="/pais" id="paisBtn">👨‍👩‍👧 Área dos pais</a>
  </section>

  <section id="play" class="hidden">
    <div class="playhead">
      <button class="back" id="backBtn">← Início</button>
      <div class="dots" id="dots"></div>
      <button class="speak" id="speakBtn">🔊</button>
    </div>
    <div class="bar"><div id="bar"></div></div>
    <div class="q" id="q"></div>
    <div class="hint" id="hint"></div>
    <div class="stage" id="stage"></div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next" id="nextBtn">Próxima</button>
  </section>

  <section id="reward" class="hidden">
    <div class="reward">
      <div class="big" id="rewardBig">🌟</div>
      <h2 id="rewardTitle">Missão feita</h2>
      <div class="bubble" id="rewardLua" style="text-align:left"></div>
      <p id="rewardText"></p>
      <div id="rewardFig" class="hidden"><div class="fig" id="rewardFigE"></div><p id="rewardFigT"></p></div>
      <button class="next show" id="againBtn">Outra missão</button>
      <button class="chip" id="homeBtn" style="margin-top:10px">Voltar ao início</button>
    </div>
  </section>

  <section id="humor" class="hidden">
    <div class="playhead"><button class="back" data-home>← Início</button><span></span></div>
    <div class="bubble" id="humorQ"></div>
    <div class="faces" id="faces"></div>
    <div class="hint">O que aconteceu? (pode escolher vários)</div>
    <div class="row" id="humorChips" style="margin:0 0 14px"></div>
    <label class="field"><span>Quer escrever o que sente? (só se quiser)</span>
      <textarea class="inp" id="humorTxt" maxlength="500" placeholder="Escreva aqui..."></textarea></label>
    <button class="next show" id="humorSend">Enviar 💛</button>
    <div class="bubble hidden" id="humorResp" style="margin-top:14px"></div>
  </section>

  <section id="nov" class="hidden">
    <div class="playhead"><button class="back" data-home>← Início</button><b>📺 Turma do Girassol</b><span></span></div>
    <div class="grid" id="capList"></div>
  </section>

  <section id="album" class="hidden">
    <div class="playhead"><button class="back" data-home>← Início</button><b>🎁 Meu álbum</b><span></span></div>
    <div class="album" id="albumBody"></div>
  </section>

  <section id="chat" class="hidden">
    <div class="playhead"><button class="back" data-home>← Início</button><b id="chatTitle">💬 Conversar</b><span></span></div>
    <div class="row" id="chatModes" style="margin-top:0"></div>
    <div class="chatlog" id="chatLog"></div>
    <form class="chatform" id="chatForm" autocomplete="off">
      <input class="inp" id="chatIn" maxlength="300" placeholder="Escreva aqui..." />
      <button type="submit">Enviar</button>
    </form>
  </section>
</div>
<script src="conteudo.js"></script>
<script>
const C = window.CONTEUDO;
const $ = (id) => document.getElementById(id);
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsJSON(k, def) { try { const v = JSON.parse(lsGet(k)); return v === null || v === undefined ? def : v; } catch (e) { return def; } }
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function pick(arr) { return arr && arr.length ? arr[Math.floor(Math.random() * arr.length)] : ""; }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

const state = {
  stars: Number(lsGet("mc-stars") || 0),
  muted: lsGet("mc-mudo") === "1",
  world: null, mode: "missao", step: 0, total: 5, queue: [], item: null,
  locked: false, tries: 0, firsts: 0, place: null, cap: null
};
const SECOES = ["abertura", "onboard", "home", "play", "reward", "humor", "nov", "album", "chat"];
function show(id) {
  SECOES.forEach(s => $(s).classList.toggle("hidden", s !== id));
  window.scrollTo(0, 0);
}

// ---------- perfil ----------
const PERFIL_PADRAO = {
  nome: "Clara", lua: "Lua", luaEmoji: "🌙", novelas: [], influs: [],
  jj: true, academia: "Alliance", faixa: "Cinza", proxima: "Cinza e preta", cor: "rosa", feito: false
};
let perfil = Object.assign({}, PERFIL_PADRAO, lsJSON("mc-perfil", {}));
const CORES = { rosa: "#ff8ad4", roxo: "#b48cff", azul: "#7cc4ff", verde: "#3ddc97", laranja: "#ff9f43", amarelo: "#ffc857" };
function salvaPerfil() {
  lsSet("mc-perfil", JSON.stringify(perfil));
  aplicaCor();
}
function aplicaCor() {
  document.documentElement.style.setProperty("--accent", CORES[perfil.cor] || CORES.rosa);
}
aplicaCor();

function usavel(s) {
  if (!perfil.jj && /\{(faixa|proxima|academia)\}|tatame|kimono|jiu|treino/i.test(s)) return false;
  if (/\{dias\}/.test(s) && sequencia() < 2) return false;
  if (/\{estrelas\}/.test(s) && state.stars < 5) return false;
  return true;
}
function fill(s) {
  const r = {
    nome: perfil.nome || "Clara",
    lua: perfil.lua || "Lua",
    novela: pick(perfil.novelas) || "sua novela favorita",
    influ: pick(perfil.influs) || "sua influencer favorita",
    academia: perfil.academia || "academia",
    faixa: (perfil.faixa || "").toLowerCase(),
    proxima: (perfil.proxima || "nova").toLowerCase(),
    estrelas: state.stars,
    dias: sequencia()
  };
  return String(s).replace(/\{(\w+)\}/g, (m, k) => (k in r ? r[k] : m));
}
function fala(lista, evitarKey) {
  const ok = lista.filter(usavel);
  if (!evitarKey) return fill(pick(ok));
  const rec = lsJSON(evitarKey, []);
  const livres = ok.filter(s => !rec.includes(s));
  const s = pick(livres.length ? livres : ok);
  rec.push(s);
  lsSet(evitarKey, JSON.stringify(rec.slice(-10)));
  return fill(s);
}

// ---------- estrelas, som, dias ----------
function saveStars() {
  lsSet("mc-stars", String(state.stars));
  $("starCount").textContent = "⭐ " + state.stars;
}
saveStars();
function renderMute() { $("muteBtn").textContent = state.muted ? "🔇" : "🔊"; }
renderMute();

function hojeKey(d) {
  d = d || new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function diasUsados() { return lsJSON("mc-dias", []); }
function marcaDia() {
  const dias = diasUsados();
  const h = hojeKey();
  if (!dias.includes(h)) {
    dias.push(h);
    lsSet("mc-dias", JSON.stringify(dias.slice(-60)));
  }
}
function sequencia() {
  const set = new Set(diasUsados());
  const d = new Date();
  if (!set.has(hojeKey(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (set.has(hojeKey(d))) { n += 1; d.setDate(d.getDate() - 1); }
  return n;
}
function renderStreak() {
  const n = sequencia();
  const el = $("streak");
  el.classList.toggle("hidden", n < 1);
  el.textContent = "🔥 " + n + (n === 1 ? " dia seguido" : " dias seguidos");
}

// ---------- registro no servidor ----------
const FILA = "mc-fila";
function deviceId() {
  let id = lsGet("mc-id");
  if (!id) {
    id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
      : "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
    lsSet("mc-id", id);
  }
  return id;
}
function getFila() { return lsJSON(FILA, []); }
let enviando = false;
async function flush() {
  if (enviando) return;
  enviando = true;
  try {
    let fila = getFila();
    while (fila.length) {
      let r;
      try {
        r = await fetch("/api/evento", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(fila[0]),
          keepalive: true
        });
      } catch (e) { break; }
      if (!(r.ok || (r.status >= 400 && r.status < 500 && r.status !== 429))) break;
      fila = getFila();
      fila.shift();
      lsSet(FILA, JSON.stringify(fila));
    }
  } finally { enviando = false; }
}
function track(ev) {
  ev.id = deviceId();
  ev.td = Date.now();
  const fila = getFila();
  fila.push(ev);
  lsSet(FILA, JSON.stringify(fila.slice(-200)));
  flush();
}
window.addEventListener("online", flush);
flush();

// ---------- config do servidor (chat, push) ----------
let config = lsJSON("mc-config", { chat: false, vapid: null });
async function carregaConfig() {
  try {
    const r = await fetch("/api/config", { cache: "no-store" });
    if (r.ok) {
      config = await r.json();
      lsSet("mc-config", JSON.stringify(config));
      if (!$("home").classList.contains("hidden")) renderWorlds();
    }
  } catch (e) { /* offline: usa o que estava guardado */ }

function speak(text, lang, force) {
  if (!window.speechSynthesis) return;
  if (state.muted && !force) return;
  window.speechSynthesis.cancel();
  const clean = String(text).replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, "");
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = lang || "pt-BR";
  u.rate = 0.92;
  speechSynthesis.speak(u);
}

// ---------- níveis ----------
function maxNivel(w) { return C.mundos[w].niveis.length; }
function getNiveis() { return lsJSON("mc-nivel", {}); }
function getLvl(w) {
  const all = getNiveis();
  return all[w] || { n: 1, placed: false, hist: [] };
}
function setLvl(w, L) {
  const all = getNiveis();
  all[w] = L;
  lsSet("mc-nivel", JSON.stringify(all));
}
function nivelInicial(w) { return Math.min(3, Math.ceil(maxNivel(w) / 2)); }

// ---------- estatísticas para a missão do dia ----------
function getStats() { return lsJSON("mc-stats", {}); }
function bumpStats(w, ok) {
  const s = getStats();
  const v = s[w] || { r: [], n: 0 };
  v.r.push(ok ? 1 : 0);
  v.r = v.r.slice(-20);
  v.n += 1;

  lsSet("mc-stats", JSON.stringify(s));

// ---------- itens ----------
function objs(emoji, n) { return Array.from({ length: n }, () => emoji).join(""); }
function objRows(emoji, n) {
  const rows = [];
  for (let i = 0; i < n; i += 5) rows.push(objs(emoji, Math.min(5, n - i)));
  return rows.join("<br>");
}
// 3 valores diferentes (> 0), incluindo o certo
function opcoes(certo, step, extra) {
  step = step || 1;
  const set = new Set([certo]);
  const cands = shuffle((extra || []).concat([certo + step, certo - step, certo + 2 * step, certo - 2 * step, certo + 3 * step]));
  for (const d of cands) {
    if (set.size >= 3) break;
    if (d > 0 && Math.round(d * 100) === d * 100 && !set.has(d)) set.add(d);
  }
  return shuffle([...set]);
}
function euro(v) { return (Number.isInteger(v) ? String(v) : v.toFixed(2).replace(".", ",")) + " €"; }
function numItem(o) {
  // o: key, q, hint, stage, certo, fmt, step, extra, why(v), nivel
  const fmt = o.fmt || String;
  return {
    key: o.key, q: o.q, hint: o.hint || "", speak: o.q, stage: o.stage || "",
    choices: opcoes(o.certo, o.step, o.extra).map(v => ({
      t: fmt(v), ok: v === o.certo,
      why: v === o.certo ? o.okWhy : o.noWhy
    }))
  };
}
const EMOJIS = ["🍎", "⭐", "🍪", "🐶", "🎈", "🧁", "🦋"];
const GOLPES = [["raspagem", 2], ["passagem", 3], ["montada", 4], ["joelho na barriga", 2], ["pegada nas costas", 4]];
const LOJA = [["sumo", 1], ["sandes", 2.5], ["gelado", 1.5], ["caderno", 3], ["revista", 4], ["pulseira", 5], ["caneta", 1], ["bolo", 2]];

function mathItem(n) {
  const emoji = pick(EMOJIS);
  if (n === 1) {
    const k = pick(["count", "count", "more", "next"]);
    if (k === "count") {
      const v = rnd(3, 20);
      return numItem({ key: "Contar " + v, q: "Quantos você vê?", hint: "Conte de 5 em 5 linhas, um por um.",
        stage: `<div class="objs ${v > 10 ? "sm" : ""}">${objRows(emoji, v)}</div>`, certo: v,
        okWhy: `São ${v}.`, noWhy: `Conte de novo, devagar. São ${v}.` });
    }
    if (k === "more") {
      const a = rnd(2, 12);
      let b = rnd(2, 12);
      if (a === b) b = a + 2;
      return {
        key: "Mais: " + a + " x " + b, q: "Onde tem mais?", hint: "Toque no grupo maior.", speak: "Onde tem mais?",
        stage: `<div class="pile"><div class="objs sm">${objRows(emoji, a)}</div><div>A</div></div><div class="pile"><div class="objs sm">${objRows("🌙", b)}</div><div>B</div></div>`,
        choices: [
          { t: "Grupo A", ok: a > b, why: a > b ? `A tem ${a}, B tem ${b}.` : `B tem ${b}, A tem ${a}. B tem mais.` },
          { t: "Grupo B", ok: b > a, why: b > a ? `B tem ${b}, A tem ${a}.` : `A tem ${a}, B tem ${b}. A tem mais.` }
        ]
      };
    }
    const s = rnd(1, 16);
    return numItem({ key: "Depois de " + (s + 2), q: "Qual número vem depois?", stage: `<div class="word">${s}  ${s + 1}  ${s + 2}  ?</div>`,
      certo: s + 3, okWhy: `Depois de ${s + 2} vem ${s + 3}.`, noWhy: `A fila sobe de 1 em 1. Depois de ${s + 2} vem ${s + 3}.` });
  }
  if (n === 2) {
    const k = pick(["fig", "eps", "golpes", "sub", "influ"]);
    if (k === "golpes" && perfil.jj) {
      const g = shuffle(GOLPES).slice(0, rnd(2, 3));
      const tot = g.reduce((a, x) => a + x[1], 0);
      return numItem({ key: "Placar " + g.map(x => x[0]).join("+"), q: "No treino você fez: " + g.map(x => x[0] + " (" + x[1] + ")").join(" + ") + ". Quantos pontos?",
        hint: "Some os pontos de cada golpe.", stage: `<div class="word">🥋 ${g.map(x => x[1]).join(" + ")} = ?</div>`, certo: tot,
        okWhy: `${g.map(x => x[1]).join(" + ")} = ${tot} pontos!`, noWhy: `Some: ${g.map(x => x[1]).join(" + ")} = ${tot}.` });
    }
    if (k === "sub" || k === "influ") {
      const a = rnd(6, 20), b = rnd(1, a - 2), r = a - b;
      const q = k === "influ" ? fill(`A {influ} postou ${a} vídeos. Você já viu ${b}. Quantos faltam?`)
        : fill(`{nome} tinha ${a} figurinhas. Deu ${b} para a amiga. Quantas sobraram?`);
      return numItem({ key: (k === "influ" ? "Vídeos " : "Tirar ") + a + "-" + b, q, hint: `${a} − ${b} = ?`,
        stage: a <= 12 ? `<div class="objs sm">${objRows(emoji, r)}</div><div class="objs sm" style="opacity:.3">${objRows(emoji, b)}</div>` : `<div class="word">${a} − ${b}</div>`,
        certo: r, okWhy: `${a} − ${b} = ${r}.`, noWhy: `Tire ${b} de ${a}. Ficam ${r}.` });
    }
    const a = rnd(2, 12), b = rnd(2, 8), s = a + b;
    const q = k === "eps" ? fill(`Você viu ${a} episódios de {novela} ontem e ${b} hoje. Quantos ao todo?`)
      : fill(`{nome} tem ${a} figurinhas. Ganhou mais ${b}. Quantas tem agora?`);
    return numItem({ key: "Somar " + a + "+" + b, q, hint: `${a} + ${b} = ?`,
      stage: s <= 14 ? `<div class="pile"><div class="objs sm">${objRows(emoji, a)}</div></div><div style="font-size:28px">+</div><div class="pile"><div class="objs sm">${objRows(emoji, b)}</div></div>` : `<div class="word">${a} + ${b}</div>`,
      certo: s, okWhy: `${a} + ${b} = ${s}.`, noWhy: `Junte tudo: ${a} + ${b} = ${s}.` });
  }
  if (n === 3) {
    const [x, y] = shuffle(LOJA).slice(0, 2);
    if (Math.random() < 0.5) {
      const tot = x[1] + y[1];
      return numItem({ key: "Loja " + x[0] + "+" + y[0], q: `Na cantina: ${x[0]} ${euro(x[1])} e ${y[0]} ${euro(y[1])}. Quanto é tudo?`,
        hint: "Some os dois preços.", stage: `<div class="word md">💶 ${euro(x[1])} + ${euro(y[1])}</div>`, certo: tot, step: tot % 1 ? 0.5 : 1, fmt: euro,
        okWhy: `${euro(x[1])} + ${euro(y[1])} = ${euro(tot)}.`, noWhy: `Some: ${euro(x[1])} + ${euro(y[1])} = ${euro(tot)}.` });
    }
    const pago = x[1] <= 4 ? 5 : 10, troco = pago - x[1];
    return numItem({ key: "Troco " + x[0] + " " + pago, q: `O ${x[0]} custa ${euro(x[1])}. Você paga com ${euro(pago)}. Qual é o troco?`,
      hint: `${euro(pago)} − ${euro(x[1])} = ?`, stage: `<div class="word md">💶 ${euro(pago)} − ${euro(x[1])}</div>`, certo: troco, step: troco % 1 ? 0.5 : 1, fmt: euro,
      okWhy: `${euro(pago)} − ${euro(x[1])} = ${euro(troco)} de troco.`, noWhy: `Tire o preço do que pagou: ${euro(troco)}.` });
  }
  if (n === 4) {
    const a = pick([2, 3, 4, 5, 10]), b = rnd(2, 5), p = a * b;
    const ctx = pick([["sacos", "balas", "🍬"], ["caixas", "lápis", "✏️"], ["mesas", "colegas", "🧒"], ["pacotes", "figurinhas", "🃏"]]);
    return numItem({ key: "Grupos " + b + "x" + a, q: `${b} ${ctx[0]} com ${a} ${ctx[1]} cada. Quantos ${ctx[1]} ao todo?`,
      hint: `${b} grupos de ${a}: ${b} × ${a}`, stage: p <= 25 ? Array.from({ length: b }, () => `<div class="pile"><div class="objs sm">${objRows(ctx[2], a)}</div></div>`).join("") : `<div class="word">${b} × ${a}</div>`,
      certo: p, extra: [a + b, p + a, p - a], okWhy: `${b} × ${a} = ${p}.`, noWhy: `Some ${b} vezes o ${a}: ${Array(b).fill(a).join(" + ")} = ${p}.` });
  }
  if (n === 5) {
    const k = pick(["metade", "dobro", "d50", "d10", "d25"]);
    if (k === "metade" || k === "dobro") {
      const v = k === "metade" ? 2 * rnd(2, 20) : rnd(3, 25), r = k === "metade" ? v / 2 : v * 2;
      return numItem({ key: k + " " + v, q: `Quanto é ${k === "metade" ? "a metade" : "o dobro"} de ${v}?`,
        hint: k === "metade" ? "Metade = dividir em 2 partes iguais." : "Dobro = duas vezes.", stage: `<div class="word">${k === "metade" ? "½" : "2×"} ${v}</div>`,
        certo: r, extra: [v + 2, r + 2], okWhy: `${k === "metade" ? "Metade" : "O dobro"} de ${v} é ${r}.`, noWhy: k === "metade" ? `${r} + ${r} = ${v}. A metade é ${r}.` : `${v} + ${v} = ${r}.` });
    }
    const pct = k === "d50" ? 50 : k === "d10" ? 10 : 25;
    const preco = pct === 25 ? pick([20, 40, 80, 100]) : pct === 10 ? pick([10, 20, 30, 40, 50, 70]) : pick([10, 16, 20, 30, 40, 60]);
    const desc = preco * pct / 100;
    if (pct === 50) {
      return numItem({ key: "Desconto 50 " + preco, q: `Uma camiseta custa ${euro(preco)}. Tem 50% de desconto. Quanto fica?`,
        hint: "50% = metade.", stage: `<div class="word md">👕 ${euro(preco)} −50%</div>`, certo: preco - desc, fmt: euro, extra: [preco],
        okWhy: `50% é metade. Fica ${euro(preco - desc)}.`, noWhy: `50% = metade de ${euro(preco)} = ${euro(preco - desc)}.` });
    }
    return numItem({ key: "Pct " + pct + " " + preco, q: `Quanto é ${pct}% de ${euro(preco)}?`,
      hint: pct === 10 ? "10% = dividir por 10." : "25% = um quarto = metade da metade.", stage: `<div class="word md">${pct}% de ${euro(preco)}</div>`,
      certo: desc, fmt: euro, okWhy: `${pct}% de ${euro(preco)} = ${euro(desc)}.`, noWhy: pct === 10 ? `${preco} ÷ 10 = ${desc}.` : `Metade de ${preco} é ${preco / 2}, metade disso é ${desc}.` });
  }
  if (n === 6) {
    const k = pick(["a+", "+b", "-", "x"]);
    if (k === "x") {
      const b = rnd(2, 5), x = rnd(2, 10), c = b * x;
      return numItem({ key: "? x " + b + " = " + c, q: "Qual número falta?", stage: `<div class="word">? × ${b} = ${c}</div>`,
        hint: `Que número vezes ${b} dá ${c}?`, certo: x, okWhy: `${x} × ${b} = ${c}.`, noWhy: `Experimente: ${x} × ${b} = ${c}.` });
    }
    if (k === "-") {
      const b = rnd(2, 9), c = rnd(3, 15), x = b + c;
      return numItem({ key: "? - " + b + " = " + c, q: "Qual número falta?", stage: `<div class="word">? − ${b} = ${c}</div>`,
        hint: `Dica: ${c} + ${b}`, certo: x, okWhy: `${x} − ${b} = ${c}.`, noWhy: `Faça ao contrário: ${c} + ${b} = ${x}.` });
    }
    const a = rnd(2, 12), x = rnd(2, 15), c = a + x;
    const txt = k === "a+" ? `${a} + ? = ${c}` : `? + ${a} = ${c}`;
    return numItem({ key: txt, q: "Qual número falta?", stage: `<div class="word">${txt}</div>`,
      hint: `Dica: ${c} − ${a}`, certo: x, okWhy: `${a} + ${x} = ${c}.`, noWhy: `Faça ao contrário: ${c} − ${a} = ${x}.` });
  }
  // nível 7: proporção
  const k = pick(["receita", "preco", "unit"]);
  if (k === "receita") {
    const ovos = rnd(2, 4), f = pick([2, 3]);
    return numItem({ key: "Receita " + ovos + "x" + f, q: `Para 2 pessoas, a receita usa ${ovos} ovos. Para ${2 * f} pessoas?`,
      hint: `${2 * f} pessoas é ${f} vezes mais.`, stage: `<div class="word md">🥚 2 → ${ovos} · ${2 * f} → ?</div>`, certo: ovos * f, extra: [ovos + 2 * f],
      okWhy: `${f} vezes mais pessoas, ${f} vezes mais ovos: ${ovos * f}.`, noWhy: `${ovos} × ${f} = ${ovos * f} ovos.` });
  }
  if (k === "preco") {
    const p = rnd(2, 5), q = rnd(3, 6);
    return numItem({ key: "Preço " + p + "x" + q, q: `Um caderno custa ${euro(p)}. Quanto custam ${q} cadernos?`,
      hint: `${q} × ${p}`, stage: `<div class="word md">📒 1 → ${euro(p)} · ${q} → ?</div>`, certo: p * q, fmt: euro, extra: [p + q],
      okWhy: `${q} × ${p} = ${euro(p * q)}.`, noWhy: `${q} vezes ${euro(p)} = ${euro(p * q)}.` });
  }
  const u = rnd(2, 5), qn = rnd(2, 4);
  return numItem({ key: "Unit " + qn + "/" + u, q: `${qn} pulseiras custam ${euro(u * qn)}. Quanto custa 1?`,
    hint: `Divida ${u * qn} por ${qn}.`, stage: `<div class="word md">📿 ${qn} → ${euro(u * qn)} · 1 → ?</div>`, certo: u, fmt: euro,
    okWhy: `${u * qn} ÷ ${qn} = ${euro(u)}.`, noWhy: `${qn} × ${u} = ${u * qn}. Então 1 custa ${euro(u)}.` });
}

function clockSVG(h, m) {
  const ha = ((h % 12) + m / 60) * 30, ma = m * 6;
  let marks = "";
  for (let i = 1; i <= 12; i++) {
    const a = i * 30 * Math.PI / 180;
    marks += `<text x="${50 + 38 * Math.sin(a)}" y="${54 - 38 * Math.cos(a)}" font-size="10" text-anchor="middle" fill="#24183a" font-weight="700">${i}</text>`;
  }
  return `<svg class="clock" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#fff8ef"/>${marks}
    <line x1="50" y1="50" x2="${50 + 22 * Math.sin(ha * Math.PI / 180)}" y2="${50 - 22 * Math.cos(ha * Math.PI / 180)}" stroke="#24183a" stroke-width="5" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="${50 + 34 * Math.sin(ma * Math.PI / 180)}" y2="${50 - 34 * Math.cos(ma * Math.PI / 180)}" stroke="#ff7a59" stroke-width="3" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="3" fill="#24183a"/></svg>`;
}
function hm(h, m) { return h + ":" + String(m).padStart(2, "0"); }
function timeGen(n) {
  if (n === 3) {
    const h = rnd(1, 12), m = pick([0, 0, 30]);
    const certo = hm(h, m);
    const cands = shuffle([hm(h % 12 + 1, m), hm(h, m ? 0 : 30), hm(h === 1 ? 12 : h - 1, m), hm(m === 30 ? 6 : 12, h * 5 % 60)]);
    const set = [certo];
    for (const c of cands) { if (set.length >= 3) break; if (!set.includes(c)) set.push(c); }
    return {
      key: "Relógio " + certo, q: "Que horas são?", hint: "Ponteiro pequeno = hora. Grande = minutos.", speak: "Que horas são?",
      stage: clockSVG(h, m),
      choices: shuffle(set).map(t => ({ t, ok: t === certo, why: t === certo ? `São ${certo}.` : `O pequeno está no ${h}${m ? " e meio" : ""}, o grande no ${m ? "6" : "12"}. São ${certo}.` }))
    };
  }
  const ctx = pick(usavelCtx());
  const diff = pick([5, 10, 15, 20, 30, 45]);
  const ini = rnd(14 * 12, 21 * 12) * 5; // minutos do dia, múltiplos de 5
  const fim = ini + diff;
  const f = (t) => hm(Math.floor(t / 60), t % 60);
  const opts = new Set([diff]);
  for (const d of shuffle([diff + 5, diff - 5, diff + 10, diff * 2, 60])) { if (opts.size >= 3) break; if (d > 0 && !opts.has(d)) opts.add(d); }
  return {
    key: "Falta " + ctx.k + " " + diff, q: fill(ctx.t.replace("#FIM", f(fim))) + ` Agora são ${f(ini)}.`, hint: "Quanto tempo falta?", speak: "",
    stage: `<div class="word md">🕒 ${f(ini)} → ${f(fim)}</div>`,
    choices: shuffle([...opts]).map(d => ({ t: d + " minutos", ok: d === diff, why: d === diff ? `De ${f(ini)} a ${f(fim)} são ${diff} minutos.` : `Conte de ${f(ini)} até ${f(fim)}: ${diff} minutos.` }))
  };
}
function usavelCtx() {
  return [
    { k: "live", t: "A live da {influ} começa às #FIM." },
    { k: "novela", t: "O episódio de {novela} começa às #FIM." },
    { k: "treino", t: "O treino na {academia} começa às #FIM." },
    { k: "autocarro", t: "O autocarro passa às #FIM." },
    { k: "jantar", t: "O jantar é às #FIM." }
  ].filter(c => usavel(c.t));
}

function bankItem(x) {
  return {
    key: x.q, q: fill(x.q), hint: fill(x.hint), speak: fill(x.q + " " + x.hint),
    stage: `<div class="word">${esc(x.stage)}</div>`,
    choices: shuffle(x.choices).map(c => ({ t: fill(c.t), ok: c.ok, why: fill(c.why) }))
  };
}
function wordItem(w, kind, lista, nivel) {
  const distract = shuffle(lista.filter(x => x.en !== w.en)).slice(0, 2);
  if (kind === "hear") {
    return {
      key: "Ouvir: " + w.en, q: "Toque no que você ouviu.", hint: "Significa: " + w.pt, speak: w.en, lang: "en-GB",
      stage: `<div class="word">${w.emoji}</div>`,
      choices: shuffle([w, ...distract]).map(x => ({ t: x.en, ok: x.en === w.en, why: x.en === w.en ? `${w.en} = ${w.pt}` : `Esta é "${w.en}".` }))
    };
  }
  return {
    key: "Significado: " + w.en, q: w.en, hint: "O que quer dizer?", speak: w.en, lang: "en-GB",
    stage: `<div class="word en ${nivel > 1 ? "md" : ""}">${esc(w.en)}</div>`,
    choices: shuffle([w, ...distract]).map(x => ({ t: x.emoji + "  " + x.pt, ok: x.en === w.en, why: x.en === w.en ? `Sim! ${w.en} = ${w.pt}` : `"${w.en}" quer dizer ${w.pt}.` }))
  };
}
function dialogoItem(d) {
  return {
    key: "Diálogo: " + d.diz, q: "Alguém diz:", hint: "Quer dizer: " + d.pt, speak: d.diz, lang: "en-GB",
    stage: `<div class="word en md">"${esc(d.diz)}"</div>`,
    choices: shuffle([d.certo, ...d.errados]).map(t => ({ t, ok: t === d.certo, why: t === d.certo ? "Boa resposta! Combina com a pergunta." : `Essa não combina. Uma boa resposta é: "${d.certo}"` }))
  };
}
function conversaItem(c) {
  return {
    key: "Conversa: " + c.diz, q: c.sit, hint: "Qual a melhor resposta?", speak: c.diz, lang: "en-GB",
    stage: `<div class="word en md">"${esc(c.diz)}"</div>`,
    choices: shuffle([c.certo, ...c.errados]).map(t => ({ t, ok: t === c.certo, why: t === c.certo ? c.why : `Melhor: "${c.certo}". ${c.why}` }))
  };
}

// Candidatos de um mundo num nível: [{key, make()}]
function candidatos(w, n) {
  if (w === "time") {
    const out = C.tempo.filter(x => x.n === n && usavel(x.q + x.hint)).map(x => ({ key: x.q, make: () => bankItem(x) }));
    if (n === 3 || n === 4) for (let i = 0; i < 8; i++) { const it = timeGen(n); out.push({ key: it.key, make: () => it }); }
    return out;
  }
  if (w === "soc") return C.social.filter(x => x.n === n && usavel(x.q + x.hint)).map(x => ({ key: x.q, make: () => bankItem(x) }));
  if (w === "en") {
    if (n === 1 || n === 2) {
      const lista = n === 1 ? C.words : C.frases;
      const out = [];
      lista.forEach(x => ["hear", "mean"].forEach(k => out.push({ key: (k === "hear" ? "Ouvir: " : "Significado: ") + x.en, make: () => wordItem(x, k, lista, n) })));
      return out;
    }
    if (n === 3) return C.dialogos.map(d => ({ key: "Diálogo: " + d.diz, make: () => dialogoItem(d) }));
    return C.conversa.map(c => ({ key: "Conversa: " + c.diz, make: () => conversaItem(c) }));
  }
  const out = [];
  for (let i = 0; i < 12; i++) { const it = mathItem(n); out.push({ key: it.key, make: () => it }); }
  return out;
}

// Perguntas que ela errou e ainda não acertou de primeira (só neste aparelho)
function getErros() { return lsJSON("mc-erros", {}); }
function bumpErro(chave, d) {
  const e = getErros();
  const n = (e[chave] || 0) + d;
  if (n > 0) e[chave] = Math.min(n, 5); else delete e[chave];
  lsSet("mc-erros", JSON.stringify(e));
}
// Escolhe n sem repetir; até 2 das que ela errou antes
function sorteia(cands, n, mundo, usadas) {
  const e = getErros();
  const vistos = new Set(usadas || []);
  const uniq = [];
  for (const c of cands) { if (!vistos.has(c.key)) { vistos.add(c.key); uniq.push(c); } }
  const erradas = shuffle(uniq.filter(c => e[mundo + "|" + c.key]));
  const resto = shuffle(uniq.filter(c => !e[mundo + "|" + c.key]));
  const out = erradas.slice(0, 2);
  for (const c of resto) { if (out.length >= n) break; out.push(c); }
  for (const c of erradas.slice(2)) { if (out.length >= n) break; out.push(c); }
  return shuffle(out);
}
function geraItens(w, n, qtd, usadas) {
  let cands = candidatos(w, n);
  if (cands.length < qtd && n > 1) cands = cands.concat(candidatos(w, n - 1));
  return sorteia(cands, qtd, w, usadas).map(c => {
    const it = c.make();
    it.key = c.key;
    it.nivel = n;
    return it;
  });
}

// ---------- jogo ----------
function renderItem() {
  state.locked = false;
  state.tries = 0;
  if (state.mode === "colocacao" && !state.queue[state.step]) {
    const usadas = state.queue.map(x => x.key);
    const it = geraItens(state.world, state.place.cur, 1, usadas)[0] || geraItens(state.world, 1, 1, usadas)[0];
    state.queue.push(it);
  }
  state.item = state.queue[state.step];
  const it = state.item;
  const nov = state.mode === "nov";
  $("q").className = "q" + (nov ? " nov" : "");
  $("q").textContent = it.q;
  $("hint").className = "hint" + (nov && it.hint ? " pq" : "");
  $("hint").textContent = it.hint;
  $("stage").innerHTML = it.stage;
  $("feedback").className = "feedback";
  $("feedback").textContent = "";
  $("nextBtn").classList.remove("show");
  $("bar").style.width = (state.step / state.total * 100) + "%";
  $("dots").innerHTML = Array.from({ length: state.total }, (_, i) =>
    `<div class="dot ${i < state.step ? "on" : ""}"></div>`).join("");
  const box = $("choices");
  box.className = "choices" + (it.choices.length === 2 ? " two" : "");
  box.innerHTML = "";
  it.choices.forEach((c, idx) => {
    const b = document.createElement("button");
    b.className = "choice" + (c.t.length > 12 ? " small" : "");
    b.textContent = c.t;
    b.onclick = () => answer(idx);
    box.appendChild(b);
  });
  if (!it.choices.length) {
    $("nextBtn").textContent = state.step + 1 >= state.total ? "Fim do capítulo ✨" : "Continuar ›";
    $("nextBtn").classList.add("show");
  }
  const falar = it.lang ? it.speak : (it.speak || it.q) + (nov && it.hint ? ". " + it.hint : "");
  speak(falar, it.lang || "pt-BR");
}

function registraErro(chosen) {
  const it = state.item;
  const certa = it.choices.find(c => c.ok);
  if (state.tries === 1) bumpErro(state.world + "|" + it.key, 1);
  track({
    tipo: "erro", mundo: state.world, perg: it.key, q: it.q,
    esc: chosen.t, certa: certa ? certa.t : "", why: certa ? certa.why : ""
  });
}

function answer(idx) {
  if (state.locked) return;
  const buttons = [...$("choices").children];
  const it = state.item;
  const chosen = it.choices[idx];
  const fb = $("feedback");
  state.tries += 1;
  if (!chosen.ok) registraErro(chosen);
  // Errou na 1a tentativa (e há mais de 2 opções): tenta de novo sem mostrar a resposta
  const retry = !chosen.ok && state.tries === 1 && it.choices.length > 2;
  if (retry) {
    buttons[idx].classList.add("bad");
    buttons[idx].disabled = true;
    fb.className = "feedback show no";
    fb.textContent = "Quase. Olhe com calma e tente de novo.";
    speak("Quase. Tente de novo.", "pt-BR");
    return;
  }
  state.locked = true;
  const firstTry = chosen.ok && state.tries === 1;
  buttons.forEach((b, i) => {
    if (it.choices[i].ok) b.classList.add("good");
    if (i === idx && !chosen.ok) b.classList.add("bad");
  });
  fb.className = "feedback show " + (chosen.ok ? "ok" : "no");
  fb.textContent = (chosen.ok ? "Boa! " : "Quase. ") + chosen.why;
  if (firstTry) {
    state.stars += 1;
    state.firsts += 1;
    saveStars();
    bumpErro(state.world + "|" + it.key, -1);
  }
  if (state.mode === "colocacao") {
    const p = state.place;
    if (firstTry) { p.maxOk = Math.max(p.maxOk, p.cur); p.cur = Math.min(maxNivel(state.world), p.cur + 1); }
    else p.cur = Math.max(1, p.cur - 1);
  }
  if (state.world !== "nov") bumpStats(state.world, firstTry);
  marcaDia();
  const ev = { tipo: "resp", mundo: state.world, ok: firstTry, tent: state.tries === 1 ? 1 : 2, perg: it.key };
  if (it.nivel) ev.nivel = it.nivel;
  track(ev);
  $("nextBtn").classList.add("show");
  $("nextBtn").textContent = state.step + 1 >= state.total ? "Ver estrela ⭐" : "Próxima";
  speak(fb.textContent, "pt-BR");
}

function start(world) {
  state.world = world;
  state.step = 0;
  state.firsts = 0;
  const L = getLvl(world);
  if (!L.placed) {
    state.mode = "colocacao";
    state.place = { cur: nivelInicial(world), maxOk: 0 };
    state.queue = [];
    state.total = 5;
  } else {
    state.mode = "missao";
    state.queue = geraItens(world, L.n, 5);
    state.total = state.queue.length;
  }
  show("play");
  renderItem();
}

function startCap(i) {
  const cap = C.novelinha[i];
  state.world = "nov";
  state.mode = "nov";
  state.cap = i;
  state.step = 0;
  state.firsts = 0;
  state.queue = cap.cenas.map((c, j) => ({
    key: "Cap" + (i + 1) + "-cena" + (j + 1),
    q: fill(c.texto),
    hint: c.pergunta ? fill(c.pergunta.q) : "",
    stage: `<div class="word">${esc(c.emoji)}</div>`,
    choices: c.pergunta ? shuffle(c.pergunta.opcoes).map(o => ({ t: fill(o.t), ok: o.ok, why: fill(o.why) })) : []
  }));
  state.total = state.queue.length;
  show("play");
  renderItem();
}

// ---------- figurinhas ----------
function getFigs() { return lsJSON("mc-figs", []); }
function ganhaFig(id) {
  const figs = getFigs();
  if (!id) {
    const livres = C.figurinhas.filter(f => !f.especial && !figs.includes(f.id));
    if (!livres.length) return null;
    id = pick(livres).id;
  }
  if (figs.includes(id)) return null;
  figs.push(id);
  lsSet("mc-figs", JSON.stringify(figs));
  return figInfo(id);
}
function figInfo(id) {
  if (id.startsWith("fx-")) return { id, e: "🥋", t: "Faixa " + id.slice(3), col: "Faixas" };
  return C.figurinhas.find(f => f.id === id);
}

// ---------- fim de missão ----------
function terminaMissao() {
  const w = state.world;
  let titulo = "Missão de " + C.mundos[w].nome + " feita!";
  let texto = state.firsts + " de " + state.total + " de primeira. Estrelas: " + state.stars + ".";
  let fig = null;
  let big = "🌟";
  if (state.mode === "nov") {
    const caps = lsJSON("mc-caps", []);
    if (!caps.includes(state.cap)) { caps.push(state.cap); lsSet("mc-caps", JSON.stringify(caps)); }
    const cap = C.novelinha[state.cap];
    titulo = "Capítulo " + (state.cap + 1) + " concluído!";
    big = cap.emoji;
    fig = ganhaFig(cap.fig);
    const prox = C.novelinha[state.cap + 1];
    texto = prox ? (state.stars >= prox.estrelas ? "O próximo capítulo já está liberado! 📺" : "Faltam " + (prox.estrelas - state.stars) + " estrelas para o próximo capítulo. Faça missões para liberar! ⭐") : "Você viu todos os capítulos! Novos em breve 🌻";
    track({ tipo: "missao", mundo: "nov" });
  } else {
    const L = getLvl(w);
    const de = L.placed ? L.n : 0;
    if (state.mode === "colocacao") {
      L.n = state.place.maxOk || 1;
      L.placed = true;
      L.hist = [];
      titulo = "Pronto! Já sei o seu nível em " + C.mundos[w].nome;
      texto = "Nível " + L.n + ": " + C.mundos[w].niveis[L.n - 1] + ". Vamos crescer juntas!";
    } else {
      L.hist = (L.hist || []).concat(state.firsts).slice(-2);
      if (L.hist.length >= 2 && L.hist.every(s => s >= 4) && L.n < maxNivel(w)) {
        L.n += 1; L.hist = [];
        big = "🚀";
        titulo = "Você subiu para o nível " + L.n + "!";
        texto = "Agora: " + C.mundos[w].niveis[L.n - 1] + ".";
      } else if (state.firsts <= 2 && L.n > 1) {
        L.n -= 1; L.hist = []; // desce sem anunciar
      }
    }
    setLvl(w, L);
    if (L.n !== de) track({ tipo: "nivel", mundo: w, de, para: L.n });
    track({ tipo: "missao", mundo: w });
    fig = ganhaFig();
  }
  marcaMdia(w);
  $("rewardBig").textContent = big;
  $("rewardTitle").textContent = titulo;
  $("rewardText").textContent = texto;
  $("rewardLua").textContent = (perfil.luaEmoji || "🌙") + " " + fala(C.fimMissao);
  $("rewardFig").classList.toggle("hidden", !fig);
  if (fig) { $("rewardFigE").textContent = fig.e; $("rewardFigT").textContent = "Figurinha nova: " + fig.t + "!"; }
  $("againBtn").textContent = state.mode === "nov" ? "Ver capítulos" : "Outra missão";
  show("reward");
  speak(titulo + ". " + $("rewardLua").textContent, "pt-BR");
}

$("nextBtn").onclick = () => {
  state.step += 1;
  if (state.step >= state.total) terminaMissao();
  else renderItem();
};
$("againBtn").onclick = () => {
  if (state.mode === "nov") abreNov();
  else if (state.mode === "faixa") start(getMdia().lista.find(w => w !== "nov") || "math");
  else start(state.world);
};

// ---------- missão do dia ----------
function getMdia() {
  let m = lsJSON("mc-mdia", null);
  if (m && m.dia === hojeKey()) return m;
  const stats = getStats();
  const ws = ["math", "time", "en", "soc"];
  const taxa = (w) => { const r = (stats[w] || {}).r || []; return r.length ? r.reduce((a, b) => a + b, 0) / r.length : 0.5; };
  const fraco = ws.slice().sort((a, b) => taxa(a) - taxa(b) || ((stats[a] || {}).n || 0) - ((stats[b] || {}).n || 0))[0];
  const fav = ws.filter(w => w !== fraco).sort((a, b) => ((stats[b] || {}).n || 0) - ((stats[a] || {}).n || 0))[0];
  const terceiro = capLiberado() >= 0 ? "nov" : pick(ws.filter(w => w !== fraco && w !== fav));
  m = { dia: hojeKey(), lista: [fraco, fav, terceiro], feitas: [] };
  lsSet("mc-mdia", JSON.stringify(m));
  return m;
}
function marcaMdia(w) {
  const m = getMdia();
  if (m.lista.includes(w) && !m.feitas.includes(w)) {
    m.feitas.push(w);
    lsSet("mc-mdia", JSON.stringify(m));
  }
}
function renderMdia() {
  const m = getMdia();
  const row = $("mdiaRow");
  row.innerHTML = "";
  m.lista.forEach(w => {
    const b = document.createElement("button");
    const feita = m.feitas.includes(w);
    b.className = "chip" + (feita ? " done" : " on");
    b.textContent = (feita ? "✅ " : C.mundos[w].emoji + " ") + C.mundos[w].nome;
    b.onclick = () => (w === "nov" ? abreNov() : start(w));
    row.appendChild(b);
  });
  if (m.feitas.length === m.lista.length) {
    const s = document.createElement("div");
    s.style.marginTop = "8px";
    s.textContent = "Missão do dia completa! Você é demais 🏆";
    row.appendChild(s);
  }
}

// ---------- Novelinha ----------
function capLiberado() {
  // índice do próximo capítulo disponível e ainda não visto, ou -1
  const caps = lsJSON("mc-caps", []);
  for (let i = 0; i < C.novelinha.length; i++) {
    if (caps.includes(i)) continue;
    const ok = i === 0 || (caps.includes(i - 1) && state.stars >= C.novelinha[i].estrelas);
    return ok ? i : -1;
  }
  return -1;
}
function abreNov() {
  const caps = lsJSON("mc-caps", []);
  const box = $("capList");
  box.innerHTML = "";
  C.novelinha.forEach((cap, i) => {
    const visto = caps.includes(i);
    const aberto = i === 0 || (caps.includes(i - 1) && state.stars >= cap.estrelas);
    const b = document.createElement("button");
    b.className = "world cap" + (aberto ? "" : " lock");
    const falta = !caps.includes(i - 1) && i > 0 ? "Veja o capítulo " + i + " primeiro" : "Faltam " + Math.max(0, cap.estrelas - state.stars) + " estrelas ⭐";
    b.innerHTML = `<div class="ico w-nov">${aberto ? cap.emoji : "🔒"}</div><div><b>Capítulo ${i + 1}: ${esc(cap.titulo)}</b><span>${visto ? "✅ Visto — pode ver de novo" : aberto ? "Novo! Toque para ver" : falta}</span></div>`;
    b.onclick = () => { if (aberto) startCap(i); else speak(falta, "pt-BR"); };
    box.appendChild(b);
  });
  show("nov");
}

// ---------- álbum ----------
function abreAlbum() {
  const figs = getFigs();
  const cols = {};
  C.figurinhas.forEach(f => { (cols[f.col] = cols[f.col] || []).push(f); });
  let html = `<div class="panel">${figs.length} figurinhas. Cada missão feita dá uma figurinha nova!</div>`;
  if (perfil.jj) {
    const fx = figs.filter(id => id.startsWith("fx-")).map(figInfo);
    html += `<h3>🥋 Minhas faixas</h3><div class="figs">${fx.map(f => `<div class="figc"><div>${f.e}</div>${esc(f.t)}</div>`).join("") || `<div class="figc"><div>🥋</div>Faixa ${esc(perfil.faixa)}</div>`}</div>`;
  }
  for (const [col, lista] of Object.entries(cols)) {
    html += `<h3>${esc(col)}</h3><div class="figs">${lista.map(f => figs.includes(f.id)
      ? `<div class="figc"><div>${f.e}</div>${esc(f.t)}</div>`
      : `<div class="figc off"><div>${f.e}</div>?</div>`).join("")}</div>`;
  }
  $("albumBody").innerHTML = html;
  show("album");
}

  iniciaChat(chat.modo || "papo");
}
function iniciaChat(id) {
  chat = { modo: id === "papo" ? "papo" : "treino", cenario: id === "papo" ? null : id, msgs: [], esperando: false };
  [...$("chatModes").children].forEach(b => b.classList.toggle("on", b.dataset.m === id));
  $("chatLog").innerHTML = "";
  const cen = C.cenarios.find(c => c.id === id);
  const oi = cen
    ? fill(`Vamos treinar! Imagina: ${cen.t.toLowerCase()}. Eu faço o papel da outra menina. Começa você: diga oi! 😊`)
    : fill("Oi, {nome}! Que bom te ver. Sobre o que vamos conversar hoje? 😊");
  addMsg("lua", oi);
  chat.msgs.push({ role: "assistant", content: oi });
}
function addMsg(quem, txt, extra) {
  const d = document.createElement("div");
  d.className = "msg " + quem + (extra ? " " + extra : "");
  d.textContent = txt;
  $("chatLog").appendChild(d);
  $("chatLog").scrollTop = $("chatLog").scrollHeight;
  return d;
}
$("chatForm").onsubmit = async (e) => {
  e.preventDefault();
  const txt = $("chatIn").value.trim().slice(0, 300);
  if (!txt || chat.esperando) return;
  $("chatIn").value = "";
  addMsg("eu", txt);
  chat.msgs.push({ role: "user", content: txt });
  chat.esperando = true;
  const w = addMsg("lua", "digitando...", "wait");
  let resp = fill("Não consegui responder agora. Tenta daqui a pouco 💛");
  try {
    const r = await fetch("/api/conversa", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: deviceId(), modo: chat.modo, cenario: chat.cenario, msgs: chat.msgs.slice(-10) })
    });
    if (r.ok) resp = (await r.json()).resposta || resp;
    else if (r.status === 429) resp = fill("Por hoje já conversamos bastante, {nome}! Amanhã tem mais 💛 Que tal uma missão?");
    else if (r.status === 403) resp = "A conversa está desligada agora. Fala com os seus pais 💛";
  } catch (err) {
    resp = "Estou sem internet agora. Enquanto isso, que tal uma missão? 💛";
  }
  w.remove();
  addMsg("lua", resp);
  chat.msgs.push({ role: "assistant", content: resp });
  chat.esperando = false;
  speak(resp, "pt-BR");
};

// ---------- onboarding / meus gostos ----------
const NOVELAS = ["Carrossel", "Caverna Encantada", "Go! Viva do Seu Jeito", "A Infância de Romeu e Julieta", "Chiquititas", "Cúmplices de um Resgate"];
const AVATARES = ["🌙", "🦄", "🐱", "🌸", "⭐", "🐼", "🦋", "🐰"];
let ob = { passo: 0, editando: false, p: null };
const PASSOS = ["eu", "novelas", "influs", "jj", "cor", "push"];
function abreOnboard(editando) {
  ob = { passo: 0, editando, p: JSON.parse(JSON.stringify(perfil)) };
  renderOb();
  show("onboard");
}
function renderOb() {
  const p = ob.p;
  const passo = PASSOS[ob.passo];
  $("obDots").innerHTML = PASSOS.map((_, i) => `<div class="dot ${i <= ob.passo ? "on" : ""}"></div>`).join("");
  $("obBack").style.visibility = ob.passo === 0 && !ob.editando ? "hidden" : "visible";
  $("obNext").textContent = ob.passo === PASSOS.length - 1 ? "Pronto! ✨" : "Próximo ›";
  const body = $("obBody");
  let h = "";
  if (passo === "eu") {
    h = `<div class="bubble">${esc(p.luaEmoji)} Oi! Eu vou ser a sua companheira aqui. Vamos nos conhecer?</div>
      <label class="field"><span>Como você se chama?</span><input class="inp" id="obNome" maxlength="30" value="${esc(p.nome)}"></label>
      <label class="field"><span>Que nome você quer me dar?</span><input class="inp" id="obLua" maxlength="20" value="${esc(p.lua)}"></label>
      <div class="field"><span>Escolha o meu rostinho</span><div class="avs" id="obAvs">${AVATARES.map(a => `<button data-a="${a}" class="${a === p.luaEmoji ? "on" : ""}">${a}</button>`).join("")}</div></div>`;
  } else if (passo === "novelas") {
    const outras = p.novelas.filter(n => !NOVELAS.includes(n));
    h = `<div class="bubble">${esc(p.luaEmoji)} Quais novelas você ama? Pode escolher várias!</div>
      <div class="row" id="obNov">${NOVELAS.map(n => `<button class="chip ${p.novelas.includes(n) ? "on" : ""}" data-n="${esc(n)}">${esc(n)}</button>`).join("")}</div>
      <label class="field" style="margin-top:14px"><span>Outra novela ou série que você gosta</span><input class="inp" id="obNovOutra" maxlength="40" value="${esc(outras.join(", "))}"></label>`;
  } else if (passo === "influs") {
    const vals = p.influs.concat(["", "", "", "", ""]).slice(0, 5);
    h = `<div class="bubble">${esc(p.luaEmoji)} Quem você mais gosta de assistir? Escreva até 5 nomes.</div>
      ${vals.map((v, i) => `<label class="field"><span>Influencer ${i + 1}</span><input class="inp obInf" maxlength="30" value="${esc(v)}"></label>`).join("")}`;
  } else if (passo === "jj") {
    const opts = (sel) => C.faixas.map(f => `<option ${f === sel ? "selected" : ""}>${esc(f)}</option>`).join("");
    h = `<div class="bubble">${esc(p.luaEmoji)} Me conta do seu esporte!</div>
      <div class="row" style="margin:0 0 14px"><button class="chip ${p.jj ? "on" : ""}" id="obJjS">🥋 Faço jiu-jitsu</button><button class="chip ${!p.jj ? "on" : ""}" id="obJjN">Não faço</button></div>
      <div id="obJjBox" class="${p.jj ? "" : "hidden"}">
        <label class="field"><span>Nome da academia</span><input class="inp" id="obAcad" maxlength="30" value="${esc(p.academia)}"></label>
        <label class="field"><span>Minha faixa agora</span><select class="inp" id="obFaixa">${opts(p.faixa)}</select></label>
        <label class="field"><span>Próxima faixa</span><select class="inp" id="obProx">${opts(p.proxima)}</select></label>
        ${ob.editando ? `<button class="bigbtn hl" id="obMudei">🎉 Mudei de faixa!</button>` : ""}
      </div>`;
  } else if (passo === "cor") {
    h = `<div class="bubble">${esc(p.luaEmoji)} Qual é a sua cor favorita?</div>
      <div class="cores">${Object.entries(CORES).map(([k, v]) => `<button class="cor ${p.cor === k ? "on" : ""}" data-c="${k}" style="background:${v}" aria-label="${k}"></button>`).join("")}</div>`;
  } else {
    const iosFora = isIOS() && !isStandalone();
    const pushOk = "Notification" in window && Notification.permission === "granted";
    h = `<div class="bubble">${esc(p.luaEmoji)} Quer que eu te mande bom dia às 7, pergunte do seu dia às 19 e diga boa noite às 21?</div>
      ${iosFora ? `<div class="panel"><b class="t">Primeiro, coloque a app na tela inicial:</b>1. Toque em compartilhar (quadrado com seta ⬆️).<br>2. Toque em "Adicionar à Tela de Início".<br>3. Abra a Clara pela tela inicial e volte aqui.</div>` : ""}
      ${pushOk ? `<div class="panel">✅ As mensagens já estão ligadas!</div>` : `<button class="bigbtn hl" id="obPush">🔔 Sim, quero!</button>`}
      <div class="hint" id="obPushMsg"></div>`;
  }
  body.innerHTML = h;
  // ligações
  if (passo === "eu") $("obAvs").querySelectorAll("button").forEach(b => b.onclick = () => {
    p.luaEmoji = b.dataset.a;
    $("obAvs").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  });
  if (passo === "novelas") $("obNov").querySelectorAll(".chip").forEach(b => b.onclick = () => {
    const n = b.dataset.n, i = p.novelas.indexOf(n);
    if (i >= 0) p.novelas.splice(i, 1); else p.novelas.push(n);
    b.classList.toggle("on", i < 0);
  });
  if (passo === "jj") {
    $("obJjS").onclick = () => { p.jj = true; lePasso(); renderOb(); };
    $("obJjN").onclick = () => { p.jj = false; lePasso(); renderOb(); };
    if ($("obMudei")) $("obMudei").onclick = () => mudeiFaixa();
  }
  if (passo === "cor") body.querySelectorAll(".cor").forEach(b => b.onclick = () => {
    p.cor = b.dataset.c;
    body.querySelectorAll(".cor").forEach(x => x.classList.toggle("on", x === b));
    document.documentElement.style.setProperty("--accent", CORES[p.cor]);
  });
  if (passo === "push" && $("obPush")) $("obPush").onclick = async () => {
    $("obPushMsg").textContent = await ativarPush();
  };
}
function lePasso() {
  const p = ob.p;
  const passo = PASSOS[ob.passo];
  if (passo === "eu") {
    p.nome = $("obNome").value.trim().slice(0, 30) || "Clara";
    p.lua = $("obLua").value.trim().slice(0, 20) || "Lua";
  } else if (passo === "novelas") {
    const outras = $("obNovOutra").value.split(",").map(s => s.trim()).filter(Boolean).slice(0, 3);
    p.novelas = p.novelas.filter(n => NOVELAS.includes(n)).concat(outras);
  } else if (passo === "influs") {
    p.influs = [...document.querySelectorAll(".obInf")].map(i => i.value.trim().slice(0, 30)).filter(Boolean).slice(0, 5);
  } else if (passo === "jj" && $("obAcad")) {
    p.academia = $("obAcad").value.trim().slice(0, 30) || "academia";
    p.faixa = $("obFaixa").value;
    p.proxima = $("obProx").value;
  }
}
function mudeiFaixa() {
  lePasso();
  const p = ob.p;
  const nova = p.proxima;
  const i = C.faixas.indexOf(nova);
  p.faixa = nova;
  p.proxima = C.faixas[Math.min(C.faixas.length - 1, i + 1)] || nova;
  perfil = Object.assign({}, perfil, p);
  salvaPerfil();
  track({ tipo: "perfil", perfil: perfilEnvio() });
  const fig = ganhaFig("fx-" + nova);
  state.stars += 5;
  saveStars();
  $("rewardBig").textContent = "🥋";
  $("rewardTitle").textContent = "Faixa " + nova.toLowerCase() + "! Parabéns!";
  $("rewardLua").textContent = (perfil.luaEmoji || "🌙") + " " + fill("Que orgulho, {nome}! Todo o seu esforço no tatame valeu a pena. Você ganhou 5 estrelas de presente! 🎉");
  $("rewardText").textContent = "Próxima meta: faixa " + p.proxima.toLowerCase() + ".";
  $("rewardFig").classList.toggle("hidden", !fig);
  if (fig) { $("rewardFigE").textContent = fig.e; $("rewardFigT").textContent = "Figurinha especial: " + fig.t + "!"; }
  state.mode = "faixa";
  $("againBtn").textContent = "Fazer uma missão";
  show("reward");
  speak($("rewardTitle").textContent + " " + $("rewardLua").textContent, "pt-BR");
}
function perfilEnvio() {
  const { nome, lua, novelas, influs, jj, academia, faixa, proxima, cor } = perfil;
  return { nome, lua, novelas, influs, jj, academia, faixa, proxima, cor };
}
$("obNext").onclick = () => {
  lePasso();
  if (ob.passo < PASSOS.length - 1) { ob.passo += 1; renderOb(); return; }
  perfil = Object.assign({}, perfil, ob.p, { feito: true });
  salvaPerfil();
  track({ tipo: "perfil", perfil: perfilEnvio() });
  goHome();
};
$("obBack").onclick = () => {
  if (ob.passo === 0) { aplicaCor(); goHome(); return; }
  lePasso();
  ob.passo -= 1;
  renderOb();
};

// ---------- notificações ----------
function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }
function isStandalone() { return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true; }
function b64ToBytes(s) {
  const pad = "=".repeat((4 - s.length % 4) % 4);
  const raw = atob((s + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}
async function ativarPush() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) {
    return isIOS() ? "Coloque a app na tela inicial primeiro (veja acima)." : "Este celular não aceita mensagens da app.";
  }
  await carregaConfig();
  if (!config.vapid) return "As mensagens ainda não estão prontas no servidor. Tente mais tarde.";
  const perm = await Notification.requestPermission();
  if (perm !== "granted") return "Tudo bem! Dá para ligar depois em ⚙️.";
  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(config.vapid) });
    const r = await fetch("/api/push", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: deviceId(), sub: sub.toJSON() }) });
    if (!r.ok) throw new Error("servidor");
    lsSet("mc-push", "1");
    return "✅ Combinado! Amanhã às 7 tem bom dia 💛";
  } catch (e) {
    return "Não consegui ligar agora. Tente de novo com internet.";
  }
}
// Renova a inscrição no servidor (caso o servidor tenha perdido ou a inscrição mudou)
async function renovaPush() {
  if (lsGet("mc-push") !== "1" || !("serviceWorker" in navigator) || !("PushManager" in window)) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) fetch("/api/push", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: deviceId(), sub: sub.toJSON() }) }).catch(() => {});
  } catch (e) {}
}

// ---------- abertura ----------
const params = new URLSearchParams(location.search);
let destino = params.get("abrir");
if (destino) history.replaceState(null, "", "/");
function abertura() {
  $("abAv").textContent = perfil.luaEmoji || "🌙";
  $("abMsg").textContent = fala(C.aberturas, "mc-abert");
  show("abertura");
  speak($("abMsg").textContent, "pt-BR");
}
$("abBtn").onclick = () => {
  if (destino === "humor") { destino = null; abreHumor(); return; }
  goHome();
};
let escondidoEm = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { escondidoEm = Date.now(); return; }
  flush();
  carregaConfig();
  // Voltou depois de 1 hora: nova mensagem de abertura
  if (perfil.feito && escondidoEm && Date.now() - escondidoEm > 3600e3 && $("play").classList.contains("hidden")) abertura();
});
navigator.serviceWorker && navigator.serviceWorker.addEventListener("message", (e) => {
  if (e.data && e.data.abrir === "humor") abreHumor();
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").then(renovaPush).catch(() => {}));
}
if (!perfil.feito) abreOnboard(false);
else abertura();
</script>
